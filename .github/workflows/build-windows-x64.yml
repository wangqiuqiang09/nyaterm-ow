name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: build-windows-x64-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  package:
    name: Package windows-x64
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc
          cache-key: dev-windows-x64
          cache-on-failure: 'true'
          save-cache: always

      - name: Resolve workspace version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install NSIS
        shell: pwsh
        run: ./scripts/ci/install-nsis.ps1

      - name: Prepare bundled ConPTY
        run: python scripts/release/prepare_conpty.py

      - name: Package native application
        shell: bash
        env:
          NYATERM_ARTIFACT_VERSION: main-snapshot
          NYATERM_VERSION: ${{ steps.version.outputs.version }}
          TARGET: x86_64-pc-windows-msvc
        run: python scripts/release/package_native.py "${TARGET}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: NyaTerm-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
